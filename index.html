<!DOCTYPE html>

<html>

    <head>

        <title>Didn't Find It?</title>

        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <link rel="stylesheet" href="includes/styles.css">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap">

    </head>

    <body>

        <!-- Screen 1: baggage belt. Each belt-child is one strip. -->
        <div id="belt-page">

            <div class="belt">
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
                <div class="belt-child"></div>
            </div>

        </div>

        <!-- Screen 2: popup. Hidden for now with display: none in CSS. -->
        <div id="popup-page">

            <div class="popupwindowfind">

                <div class="content">

                    <div class="didnt-find-it">Didn't find it?</div>

                    <div class="buttons">

                        <button class="button" id="file-claim-button">
                            <span class="button-text">Make a report</span>
                        </button>

                        <button class="button" id="keep-waiting-button">
                            <span class="button-text">Keep waiting</span>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <script src="includes/scripts.js"></script>

    </body>

</html>
